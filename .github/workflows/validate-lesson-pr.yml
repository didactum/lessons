name: validate-lesson-pr
on:
  pull_request:
    paths: ["lessons/**", "schema/**", "scripts/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema
      - run: npm run validate
